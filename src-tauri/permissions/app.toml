# 应用自身命令的权限集合。
# 主窗口的本地页面与能力文件中显式允许的 Vite 调试来源均需按清单调用。
# 新增桥接命令时须同步登记具名权限，不以 Rust 单测通过代替真实 IPC 验收。
[[permission]]
identifier = "allow-app-commands"
description = "允许调用应用自身的命令（调试模式下的 Vite 来源需要）"
commands.allow = [
  "account_status",
  "account_login",
  "account_cancel",
  "account_logout",
  "account_open_page",
  "account_reopen_login",
  "account_avatar",
  "app_info",
  "get_ws_port",
  "get_ws_token",
  "secret_sync",
  "secret_set",
  "secret_clear",
  "restart_sidecar",
  "prepare_for_update",
  "pick_save_path",
  "pick_open_paths",
  "pick_work_folder",
  "embed_show",
  "embed_hide",
  "embed_release",
  "embed_supported",
  "open_devtools",
]
