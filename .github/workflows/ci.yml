name: DecryptHub core
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  core:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.16.0'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm --prefix sidecar ci --ignore-scripts
      - run: npm --prefix sidecar rebuild node-pty
        if: runner.os == 'Linux'
      - run: npm run check:powershell
        if: runner.os == 'Windows'
      - run: node --test --test-concurrency=2 sidecar/test/*.test.mjs
      - run: npm run build:ui
      - run: node scripts/check-update-shutdown.mjs
      - run: npx --yes bun@1.4.4 scripts/build-sidecar.mjs win
        if: runner.os == 'Windows'
      - run: node scripts/prepare-node.mjs
        if: runner.os == 'Windows'
      - run: node scripts/check-sidecar.mjs
        if: runner.os == 'Windows'
      - run: npx --yes bun@1.4.4 scripts/build-sidecar.mjs linux
        if: runner.os == 'Linux'
      - run: node scripts/check-sidecar.mjs build/jsra-sidecar-linux
        if: runner.os == 'Linux'
  integration:
    runs-on: windows-latest
    env:
      DECRYPTHUB_GITHUB_TOKEN: ${{ github.token }}
      JSRA_DEV: '1'
      DECRYPTHUB_WDH_DIR: ${{ github.workspace }}/wdh
    defaults:
      run:
        working-directory: harness
    steps:
      - uses: actions/checkout@v4
        with:
          path: harness
      - uses: actions/checkout@v4
        with:
          repository: decrypthub/WebDecryptHub
          ref: beed60df896d0fe96a0d57c8d748f2f815bd652f
          path: wdh
      - uses: actions/setup-node@v4
        with:
          node-version: '24.16.0'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --ignore-scripts
      - run: npm --prefix sidecar ci --ignore-scripts
      - run: npm --prefix ../wdh ci --ignore-scripts
      - run: npm run check:wdh -- ../wdh
      - name: Cache CloakBrowser kernel
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/ui-data/WebDecryptHub/kernels
          key: cloak-kernel-${{ runner.os }}-v145
      - name: Install CloakBrowser kernel for UI checks
        run: node ../wdh/src/cli.mjs kernel install cloak --kernel-dir "${{ runner.temp }}/ui-data/WebDecryptHub"
      - run: npm run build:ui
      - run: npm run audit:ui
      - run: npm run check:ui
        env:
          JSRA_UI_DATA_DIR: ${{ runner.temp }}\ui-data
      - run: npm run check:plugins
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: integration-ui-screenshots
          path: |
            harness/artifacts/ui/*.png
            harness/artifacts/plugins/*.png
          retention-days: 7
