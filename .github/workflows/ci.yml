name: DecryptHub core
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  core:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.16.0'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm --prefix sidecar ci --ignore-scripts
      - run: node --test sidecar/test/*.test.mjs
      - run: npm run build:ui
      - run: node scripts/check-update-shutdown.mjs
      - run: npx --yes bun@1.4.4 scripts/build-sidecar.mjs win
        if: runner.os == 'Windows'
